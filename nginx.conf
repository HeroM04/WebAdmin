server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén gzip để tải trang nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cho phép upload file lớn (ảnh khuôn mặt, Excel...)
    client_max_body_size 50m;

    # ================== PROXY SANG BACKEND ==================
    # FE gọi API/WS bằng đường tương đối (/api/v1, /ws) → nginx chuyển sang
    # service "backend" trong cùng mạng Docker. Nhờ vậy không dính CORS.

    # REST API
    location ^~ /api/ {
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Ảnh upload (khi backend chạy storage local thay vì S3)
    location ^~ /uploads/ {
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
    }

    # WebSocket realtime (SockJS + STOMP)
    location ^~ /ws/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /ws-feedbacks/ {
        proxy_pass http://backend:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ================== TĨNH + SPA ==================
    # Cache tài sản tĩnh
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Fallback về index.html cho các route của React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
